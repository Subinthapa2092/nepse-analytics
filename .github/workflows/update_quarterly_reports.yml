name: Update Quarterly Reports

on:
  schedule:
    - cron: '45 9 * * 0'
  workflow_dispatch:

jobs:
  update-quarterly-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Rebuild company list (symbol lookup)
        run: python companies/scrape_company_list.py
      - name: Scrape quarterly reports (all symbols)
        run: python quarterly/scrape_quarterly_reports.py
      - name: Push quarterly reports to Supabase
        run: python quarterly/push_quarterly_reports.py