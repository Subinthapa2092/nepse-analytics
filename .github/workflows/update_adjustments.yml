name: Update Adjustment Factors

on:
  schedule:
    # 09:30 UTC Sunday = 3:15 PM Nepal time, Sunday -- corporate actions
    # don't happen daily, so weekly is plenty
    - cron: '30 9 * * 0'
  workflow_dispatch:

jobs:
  update-adjustments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild company list (symbol lookup)
        run: python companies/scrape_company_list.py
      - name: Scrape corporate action dates (ShareSansar)
        run: python adjusted_prices/scrape_sharesansar_dates.py
      - name: Recompute adjustment factors
        run: python adjusted_prices/compute_adjustment_factors.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Push adjustment factors to Supabase
        run: python adjusted_prices/push_adjustment_factors.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Sync adjustment factors to nepse_floorsheet
        run: python adjusted_prices/push_adjustment_factors_to_floorsheet.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLOORSHEET_DATABASE_URL: ${{ secrets.FLOORSHEET_DATABASE_URL }}