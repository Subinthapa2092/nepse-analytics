name: Daily NEPSE Fetch

on:
  schedule:
    # 09:21 UTC = 3:06 PM Nepal time, Mon-Fri
    - cron: '21 9 * * 1-5'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily price fetch
        run: python -m scraper.fetch_prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}